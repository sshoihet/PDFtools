<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Tools</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    
<!-- PDF Rendering & Manipulation Engines (CDNJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.9/pdf-lib.min.js"></script>
</head>
<body>

    <div class="container">
        <div class="controls">
            <div class="mode-switch">
                <button id="btnModeMerge" class="mode-btn active">MERGE MODE</button>
                <button id="btnModeSplit" class="mode-btn">SPLIT MODE</button>
                <button id="btnModeForm" class="mode-btn">FIELD EDITOR</button>
            </div>
            
            <div id="splitControls" style="display:none; margin-top: 10px;">
                <input type="text" id="jobNameInput" placeholder="Enter file name to extract to" autocomplete="off">
            </div>
        </div>

        <div id="dropZone" class="drop-zone">
            <h3>DROP PDFS HERE</h3>
            <p style="color: #8b949e">or click to browse</p>
            <input type="file" id="fileInput" multiple accept=".pdf" style="display:none">
        </div>

        <!-- FILE LIST -->
        <div id="fileList" class="file-list">
            <!-- Items injected by JS -->
        </div>

        <!-- FORM FIELD WORKSPACE -->
        <div id="formWorkspace" style="display: none; margin-top: 20px;">
            <div style="display: flex; gap: 10px; margin-bottom: 12px; justify-content: center; align-items: center; flex-wrap: wrap;">
                <input type="text" id="fieldNameInput" placeholder="Field Name (e.g., Customer_Project)" style="padding: 8px; background: var(--surface); border: 1px solid var(--border); color: white; border-radius: 4px; font-family: var(--mono); width: 220px;">
                
                <!-- Zoom Controls -->
                <div class="zoom-controls">
                    <button id="btnZoomOut" class="mode-btn" type="button" title="Zoom Out">−</button>
                    <span id="zoomLabel">100%</span>
                    <button id="btnZoomIn" class="mode-btn" type="button" title="Zoom In">+</button>
                </div>

                <button id="btnApplyField" class="mode-btn" style="background: var(--accent); color: white; border-color: var(--accent);">INJECT FIELD</button>
            </div>
            
            <!-- Scrollable Viewport -->
            <div id="canvasViewport">
                <div id="canvasWrapper">
                    <canvas id="pdfCanvas"></canvas>
                    <div id="selectionBox"></div>
                </div>
            </div>
        </div>

        <!-- ACTION BUTTON -->
        <button id="mergeBtn" class="btn-merge">SYSTEM INITIALIZING...</button>

        <!-- LOGS -->
        <div id="statusBar" class="status-bar">
            > SYSTEM: Booting Web Worker...
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
