<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Tools</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    
    <!-- Native PDF Rendering and AcroForm Manipulation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.9/dist/pdf-lib.min.js"></script>
</head>
<body>

    <div class="container">
        <div class="controls">
            <div class="mode-switch">
                <button id="btnModeMerge" class="mode-btn active">MERGE MODE</button>
                <button id="btnModeSplit" class="mode-btn">SPLIT MODE</button>
                <button id="btnModeForm" class="mode-btn">FIELD EDITOR</button>
            </div>
            
            <div id="splitControls" style="display:none; margin-top: 10px;">
                <input type="text" id="jobNameInput" placeholder="Enter file name to extract to" autocomplete="off">
            </div>
        </div>

        <div id="dropZone" class="drop-zone">
            <h3>DROP PDFS HERE</h3>
            <p style="color: #8b949e">or click to browse</p>
            <input type="file" id="fileInput" multiple accept=".pdf" style="display:none">
        </div>

        <!-- FILE LIST -->
        <div id="fileList" class="file-list">
            <!-- Items injected by JS -->
        </div>

        <!-- FORM FIELD WORKSPACE -->
        <div id="formWorkspace" style="display: none; margin-top: 20px;">
            <div style="display: flex; gap: 10px; margin-bottom: 12px; justify-content: center;">
                <input type="text" id="fieldNameInput" placeholder="Field Name (e.g., Customer_Project)" style="padding: 8px; background: var(--surface); border: 1px solid var(--border); color: white; border-radius: 4px; font-family: var(--mono); width: 280px;">
                <button id="btnApplyField" class="mode-btn" style="background: var(--accent); color: white; border-color: var(--accent);">INJECT FIELD</button>
            </div>
            
            <div id="canvasContainer" style="position: relative; display: inline-block; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; background: #000;">
                <canvas id="pdfCanvas" style="display: block;"></canvas>
                <div id="selectionBox" style="position: absolute; border: 2px dashed #238636; background: rgba(35, 134, 54, 0.25); display: none; pointer-events: none;"></div>
            </div>
        </div>

        <!-- ACTION BUTTON -->
        <button id="mergeBtn" class="btn-merge">SYSTEM INITIALIZING...</button>

        <!-- LOGS -->
        <div id="statusBar" class="status-bar">
            > SYSTEM: Booting Web Worker...
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
